name: Skills checks

on:
  push:
    branches: [main, work]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  lightweight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python tools/check.py

      - name: Retrieval regression report
        run: python tools/run_evals.py retrieval --split test --output .tmp/retrieval-test.json

      - name: Knowledge evidence freshness
        run: python tools/knowledge_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-${{ matrix.os }}-${{ matrix.python }}
          path: .tmp/retrieval-test.json
